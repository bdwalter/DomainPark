<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenContext</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        img {
            max-width: 320px;
            width: 80%;
            height: auto;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: #999;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <main>
        <img src="images/logo.png" alt="OpenContext logo">
    </main>
    <footer>
        &copy; 2026 OpenContext
    </footer>
</body>
</html>
